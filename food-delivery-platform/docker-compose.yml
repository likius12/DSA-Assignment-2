name: food-delivery-platform

services:

  # ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fdp-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fdp-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped # ADDED

  # KAFKA BROKER
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fdp-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - fdp-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s # ADDED - Give Kafka time to start
    restart: unless-stopped # ADDED

  # KAFKA UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fdp-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # MONGODB
  mongodb:
    image: mongo:7.0
    container_name: fdp-mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
    networks:
      - fdp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped # ADDED

  # MONGO EXPRESS
  mongo-express:
    image: mongo-express:latest
    container_name: fdp-mongo-express
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8088:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # CUSTOMER SERVICE
  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: fdp-customer-service
    hostname: customer-service
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      MONGO_URI: mongodb://admin:admin123@mongodb:27017
      PORT: 8081
      JAVA_OPTS: "-Dballerina.observe.metrics.port=9797"
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # DELIVERY SERVICE
  delivery-service:
    build:
      context: ./delivery-service
      dockerfile: Dockerfile
    container_name: fdp-delivery-service
    hostname: delivery-service
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: 8085
      JAVA_OPTS: "-Dballerina.observe.metrics.port=9797"
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # ORDER SERVICE
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: fdp-order-service
    hostname: order-service
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: 8083
      JAVA_OPTS: "-Dballerina.observe.metrics.port=9797"
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # NOTIFICATION SERVICE
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: fdp-notification-service
    hostname: notification-service
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: 8086
      JAVA_OPTS: "-Dballerina.observe.metrics.port=9797"
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # PAYMENT SERVICE
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: fdp-payment-service
    hostname: payment-service
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: 8084
      JAVA_OPTS: "-Dballerina.observe.metrics.port=9797"
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # RESTAURANT SERVICE
  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    container_name: fdp-restaurant-service
    hostname: restaurant-service
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: 8082
      JAVA_OPTS: "-Dballerina.observe.metrics.port=9797"
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # ADMIN SERVICE
  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: fdp-admin-service
    hostname: admin-service
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      PORT: 8087
      JAVA_OPTS: "-Dballerina.observe.metrics.port=9797"
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # PROMETHEUS
  prometheus:
    image: prom/prometheus:latest
    container_name: fdp-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

  # GRAFANA
  grafana:
    image: grafana/grafana:latest
    container_name: fdp-grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fdp-network
    restart: unless-stopped # ADDED

networks:
  fdp-network:
    driver: bridge

volumes:
  mongo-data:
  prometheus-data:
  grafana-data: